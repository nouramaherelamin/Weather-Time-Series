{% load static %}
<!doctype html>
<html lang="en" data-bs-theme="dark" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atmos · Weather Predictor</title>
  <script>
    (function () {   /* apply saved theme/language BEFORE first paint (no flash) */
      try {
        var t = localStorage.getItem("atmos-theme") || "dark", l = localStorage.getItem("atmos-lang") || "en", d = document.documentElement;
        d.setAttribute("data-theme", t); d.setAttribute("data-bs-theme", t);
        if (l === "ar") { d.setAttribute("lang", "ar"); d.setAttribute("dir", "rtl"); }
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{% static 'forecast/style.css' %}" rel="stylesheet">
</head>
<body>
<div class="scene" id="scene" aria-hidden="true" style="--city-photo: url('{{ bg_current }}')" data-bg-default="{{ bg_default }}"
     {% for slug, url in backgrounds.items %}data-bg-{{ slug }}="{{ url }}" {% endfor %}></div>

<header class="topbar container">
  <a class="brand" href="{% url 'index' %}">
    <span class="brand-logo"><i class="bi bi-cloud-sun-fill"></i></span>
    <span><strong>Atmos</strong><small data-i18n="tagline">Weather Intelligence</small></span>
  </a>
  <nav class="nav-pills-glass">
    <a href="{% url 'index' %}" class="{% if active == 'home' %}active{% endif %}"><i class="bi bi-house-door-fill me-1"></i><span data-i18n="nav_home">Home</span></a>
    <a href="{% url 'insights' %}" class="{% if active == 'insights' %}active{% endif %}"><span data-i18n="nav_insights">Insights</span></a>
    <a href="{% url 'batch' %}" class="{% if active == 'batch' %}active{% endif %}"><span data-i18n="nav_batch">Batch</span></a>
    <a href="{% url 'api_docs' %}" class="{% if active == 'api' %}active{% endif %}">API</a>
    <a href="{% url 'about' %}" class="{% if active == 'about' %}active{% endif %}"><span data-i18n="nav_about">About</span></a>
    <button type="button" class="icon-btn" id="lang-toggle" title="Language / اللغة">AR</button>
    <button type="button" class="icon-btn" id="theme-toggle" title="Light / Dark"><i class="bi bi-brightness-high-fill"></i></button>
  </nav>
</header>

{% block content %}{% endblock %}


<footer class="footer">
  <div class="container">
    <div class="d-flex flex-row flex-wrap justify-content-center align-items-center gap-3">
      <span>© 2026</span>
      <strong>{{ author.name }}</strong>
      <span class="muted" data-i18n="rights">All rights reserved.</span>
      <a href="{{ author.linkedin }}" target="_blank"
         rel="noopener noreferrer" class="text-reset fs-5"
         aria-label="LinkedIn">
        <i class="bi bi-linkedin"></i>
      </a>
      <a href="{{ author.github }}" target="_blank"
         rel="noopener noreferrer" class="text-reset fs-5"
         aria-label="GitHub">
        <i class="bi bi-github"></i>
      </a>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3"></script>
<script src="{% static 'forecast/app.js' %}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
