<label for="{{ field.id_for_label }}" class="form-label"><i class="bi {{ icon }} label-icon"></i><span data-i18n="{{ i18n }}">{{ field.label }}</span></label>
<select name="{{ field.html_name }}" id="{{ field.id_for_label }}" class="form-select glass-input">
  {% for value, text in field.field.choices %}<option value="{{ value }}" {% if field.value == value %}selected{% endif %}>{{ text }}</option>{% endfor %}
</select>
