name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: django_app/requirements.txt
      - run: pip install -r django_app/requirements.txt
      - name: Run tests (builds tiny synthetic models, no internet needed)
        run: cd django_app && python manage.py test -v 2
      - name: Django system check
        run: cd django_app && python manage.py check
